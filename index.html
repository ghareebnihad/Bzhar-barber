<!DOCTYPE html>
<html lang="ku" dir="rtl" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0B0C" />
  <title>سەرتراشخانا کوچەر</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Noto+Naskh+Arabic:wght@500;600;700&family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            obsidian: '#0B0B0C',
            charcoal: '#131316',
            graphite: '#1C1C21',
            gold: {
              DEFAULT: '#C5A059',
              light: '#DFC183',
              dark: '#9E7D3E',
            },
            ivory: '#F4F1EA',
            muted: '#94918B',
          },
          fontFamily: {
            serif: ['"Noto Naskh Arabic"', '"Vazirmatn"', 'serif'],
            sans: ['"Vazirmatn"', 'sans-serif'],
            signature: ['"Cormorant Garamond"', 'serif'],
          },
        }
      }
    }
  </script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
      font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #0B0B0C;
      color: #F4F1EA;
      font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      padding-bottom: env(safe-area-inset-bottom);
      position: relative;
    }

    .fixed-bg-photo {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background-color: #0B0B0C;
      background-image:
        linear-gradient(180deg, rgba(11, 11, 12, 0.52) 0%, rgba(11, 11, 12, 0.68) 52%, rgba(11, 11, 12, 0.9) 100%),
        url('https://raw.githubusercontent.com/ghareebnihad/Bzhar-barber/refs/heads/main/cover.png');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }

    .glass-card {
      background: rgba(19, 19, 22, 0.76);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .gold-gradient-text {
      background: linear-gradient(135deg, #F8E2B0 0%, #C5A059 52%, #9E7D3E 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .service-tile {
      aspect-ratio: 1 / 1;
      border-radius: 18px;
    }

    .barber-pole-loader {
      width: 108px;
      height: 108px;
      border-radius: 9999px;
      padding: 6px;
      background: repeating-linear-gradient(
        45deg,
        #2563EB 0px,
        #2563EB 11px,
        #F8FAFC 11px,
        #F8FAFC 21px,
        #DC2626 21px,
        #DC2626 32px,
        #F8FAFC 32px,
        #F8FAFC 42px
      );
      background-size: 60px 60px;
      animation: barberPoleSpin 1s linear infinite;
      box-shadow: 0 0 28px rgba(37, 99, 235, 0.3), 0 0 28px rgba(220, 38, 38, 0.3);
    }

    .barber-pole-inner {
      width: 100%;
      height: 100%;
      border-radius: 9999px;
      background: rgba(19, 19, 22, 0.96);
      border: 1.5px solid rgba(197, 160, 89, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scissor-snip {
      transform-origin: center center;
      animation: scissorSnip 0.45s ease-in-out infinite alternate;
    }

    @keyframes barberPoleSpin {
      0% { background-position: 0 0; transform: rotate(0deg); }
      100% { background-position: 60px 60px; transform: rotate(360deg); }
    }

    @keyframes scissorSnip {
      0% { transform: rotate(-10deg) scale(0.96); }
      100% { transform: rotate(10deg) scale(1.04); }
    }

    /* Köşede kalın kırmızı şerit ve üstünde çapraz VIP yazısı */
    .vip-corner-ribbon {
      position: absolute;
      top: 18px;
      left: -34px;
      width: 124px;
      padding: 5px 0;
      background: linear-gradient(135deg, #EF4444 0%, #DC2626 60%, #B91C1C 100%);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.22em;
      text-align: center;
      transform: rotate(-45deg);
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.55);
      border-top: 1px solid rgba(255, 255, 255, 0.35);
      border-bottom: 1px solid rgba(0, 0, 0, 0.35);
      pointer-events: none;
      z-index: 15;
    }
  </style>
</head>
<body class="antialiased">
  <div class="fixed-bg-photo" aria-hidden="true"></div>

  <div id="actionLoader" class="hidden fixed inset-0 z-50 bg-obsidian/90 backdrop-blur-md flex flex-col items-center justify-center gap-3">
    <div class="barber-pole-loader">
      <div class="barber-pole-inner">
        <svg class="scissor-snip w-10 h-10 text-gold" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="6" r="2.5" />
          <circle cx="6" cy="18" r="2.5" />
          <line x1="8.2" y1="8.2" x2="20" y2="20" />
          <line x1="8.2" y1="15.8" x2="20" y2="4" />
        </svg>
      </div>
    </div>
    <span class="text-xs sm:text-sm font-bold text-gold tracking-wider">چاوەڕێ بە...</span>
  </div>

  <section id="homeHero" class="min-h-screen flex items-center justify-center px-4 relative z-10">
    <div class="flex flex-row items-center justify-center gap-3 sm:gap-4 w-full max-w-md">
      <button
        type="button"
        id="btnReservation"
        class="flex-1 py-3.5 px-4 rounded-xl bg-gold text-obsidian text-sm sm:text-base font-bold hover:bg-gold-light active:scale-95 transition-all text-center"
      >
        تۆمارکرنا ناڤی
      </button>

      <button
        type="button"
        id="btnServices"
        class="flex-1 py-3.5 px-4 rounded-xl glass-card border border-gold/65 text-gold text-sm sm:text-base font-bold hover:bg-gold hover:text-obsidian active:scale-95 transition-all text-center"
      >
        خزمەتگوزاری ببینە
      </button>
    </div>
  </section>

  <section id="reservationSection" class="hidden min-h-screen flex items-center justify-center px-4 py-16 relative z-10">
    <div class="w-full max-w-md glass-card border border-gold/35 rounded-2xl p-6 sm:p-8 space-y-5">
      <div class="flex items-center justify-between">
        <h2 class="font-serif text-2xl font-bold text-ivory">تۆمارکرنا ناڤی</h2>
        <button type="button" id="backFromReservation" class="text-xs font-bold text-gold hover:text-gold-light px-3 py-1.5 rounded-lg border border-gold/40">
          زڤرین
        </button>
      </div>

      <form id="simpleBookingForm" class="space-y-4">
        <div>
          <label for="custName" class="block text-xs font-semibold text-gold mb-1.5">ناڤ و پاشناڤ</label>
          <input id="custName" type="text" required placeholder="ناڤێ خۆ بنڤیسە..." class="w-full rounded-xl bg-obsidian/70 border border-white/15 focus:border-gold px-3.5 py-3 text-ivory outline-none" />
        </div>
        <div>
          <label for="custPhone" class="block text-xs font-semibold text-gold mb-1.5">ژمارا مۆبایلێ</label>
          <input id="custPhone" type="tel" dir="ltr" required placeholder="0750 000 0000" class="w-full rounded-xl bg-obsidian/70 border border-white/15 focus:border-gold px-3.5 py-3 text-ivory text-left outline-none" />
        </div>
        <button type="submit" class="w-full py-3.5 rounded-xl bg-gold text-obsidian text-sm sm:text-base font-bold hover:bg-gold-light active:scale-95 transition-all">
          تۆمار بکە
        </button>
      </form>

      <div id="bookingResult" class="hidden text-center pt-2 space-y-2">
        <p class="text-sm font-bold text-gold">ناڤێ تە ب سەرکەفتی هاتە تۆمارکرن</p>
        <p id="resultText" class="text-sm text-ivory/90"></p>
      </div>
    </div>
  </section>

  <section id="servicesSection" class="hidden min-h-screen px-4 sm:px-6 py-14 relative z-10">
    <div class="max-w-4xl mx-auto">
      <div class="flex items-center justify-between mb-6">
        <h2 class="font-serif text-2xl sm:text-3xl font-bold text-ivory">خزمەتگوزاری و نرخ</h2>
        <button type="button" id="backFromServices" class="text-xs font-bold text-gold hover:text-gold-light px-3.5 py-2 rounded-lg glass-card border border-gold/45">
          زڤرین
        </button>
      </div>

      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
        <article class="service-tile glass-card border border-red-500/75 relative overflow-hidden flex flex-col justify-between">
          <div class="vip-corner-ribbon">VIP</div>
          <img src="https://github.com/ghareebnihad/Bzhar-barber/blob/main/normal.jpg?raw=true" alt="VIP" loading="eager" referrerpolicy="no-referrer" class="absolute inset-0 w-full h-full object-cover" onerror="this.style.display='none'" />
          <div class="absolute inset-0 bg-gradient-to-t from-obsidian via-obsidian/55 to-obsidian/15"></div>
          <div class="relative z-10 p-2.5 flex items-center justify-end">
            <span class="px-2 py-0.5 rounded-md bg-obsidian/80 border border-gold/45 text-gold text-[10px] font-bold">#1</span>
          </div>
          <div class="relative z-10 p-3 text-right bg-obsidian/55 border-t border-white/10">
            <div class="font-serif text-sm sm:text-base font-bold text-ivory truncate">VIP</div>
            <div class="text-sm sm:text-lg font-extrabold gold-gradient-text mt-0.5" dir="ltr">10,000</div>
          </div>
        </article>

        <article class="service-tile glass-card border border-white/15 relative overflow-hidden flex flex-col justify-between">
          <img src="https://github.com/ghareebnihad/Bzhar-barber/blob/main/normal.jpg?raw=true" alt="چێکرنا پرچێ بو مەزنا" loading="eager" referrerpolicy="no-referrer" class="absolute inset-0 w-full h-full object-cover" onerror="this.style.display='none'" />
          <div class="absolute inset-0 bg-gradient-to-t from-obsidian via-obsidian/55 to-obsidian/15"></div>
          <div class="relative z-10 p-2.5 flex items-center justify-between">
            <span class="px-2 py-0.5 rounded-md bg-obsidian/80 border border-gold/45 text-gold text-[10px] font-bold">#2</span>
          </div>
          <div class="relative z-10 p-3 text-right bg-obsidian/55 border-t border-white/10">
            <div class="font-serif text-sm sm:text-base font-bold text-ivory truncate">چێکرنا پرچێ بو مەزنا</div>
            <div class="text-sm sm:text-lg font-extrabold gold-gradient-text mt-0.5" dir="ltr">5,000</div>
          </div>
        </article>

        <article class="service-tile glass-card border border-white/15 relative overflow-hidden flex flex-col justify-between">
          <img src="https://raw.githubusercontent.com/ghareebnihad/Bzhar-barber/refs/heads/main/face.png" alt="پاقژکرنا سەروچاڤا بخار" loading="eager" referrerpolicy="no-referrer" class="absolute inset-0 w-full h-full object-cover" onerror="this.style.display='none'" />
          <div class="absolute inset-0 bg-gradient-to-t from-obsidian via-obsidian/55 to-obsidian/15"></div>
          <div class="relative z-10 p-2.5 flex items-center justify-between">
            <span class="px-2 py-0.5 rounded-md bg-obsidian/80 border border-gold/45 text-gold text-[10px] font-bold">#3</span>
          </div>
          <div class="relative z-10 p-3 text-right bg-obsidian/55 border-t border-white/10">
            <div class="font-serif text-sm sm:text-base font-bold text-ivory truncate">پاقژکرنا سەروچاڤا بخار</div>
            <div class="text-sm sm:text-lg font-extrabold gold-gradient-text mt-0.5" dir="ltr">5,000</div>
          </div>
        </article>

        <article class="service-tile glass-card border border-white/15 relative overflow-hidden flex flex-col justify-between">
          <img src="https://raw.githubusercontent.com/ghareebnihad/Bzhar-barber/refs/heads/main/cocuk.jpg" alt="چێکرنا پرچێ بو زاروکا" loading="eager" referrerpolicy="no-referrer" class="absolute inset-0 w-full h-full object-cover" onerror="this.style.display='none'" />
          <div class="absolute inset-0 bg-gradient-to-t from-obsidian via-obsidian/55 to-obsidian/15"></div>
          <div class="relative z-10 p-2.5 flex items-center justify-between">
            <span class="px-2 py-0.5 rounded-md bg-obsidian/80 border border-gold/45 text-gold text-[10px] font-bold">#4</span>
          </div>
          <div class="relative z-10 p-3 text-right bg-obsidian/55 border-t border-white/10">
            <div class="font-serif text-sm sm:text-base font-bold text-ivory truncate">چێکرنا پرچێ بو زاروکا</div>
            <div class="text-sm sm:text-lg font-extrabold gold-gradient-text mt-0.5" dir="ltr">3,000</div>
          </div>
        </article>

        <article class="service-tile glass-card border border-white/15 relative overflow-hidden flex flex-col justify-between">
          <img src="https://raw.githubusercontent.com/ghareebnihad/Bzhar-barber/refs/heads/main/edit.png" alt="تعدیلات" loading="eager" referrerpolicy="no-referrer" class="absolute inset-0 w-full h-full object-cover" onerror="this.style.display='none'" />
          <div class="absolute inset-0 bg-gradient-to-t from-obsidian via-obsidian/55 to-obsidian/15"></div>
          <div class="relative z-10 p-2.5 flex items-center justify-between">
            <span class="px-2 py-0.5 rounded-md bg-obsidian/80 border border-gold/45 text-gold text-[10px] font-bold">#5</span>
          </div>
          <div class="relative z-10 p-3 text-right bg-obsidian/55 border-t border-white/10">
            <div class="font-serif text-sm sm:text-base font-bold text-ivory truncate">تعدیلات</div>
            <div class="text-sm sm:text-lg font-extrabold gold-gradient-text mt-0.5" dir="ltr">3,000</div>
          </div>
        </article>

        <article class="service-tile glass-card border border-white/15 relative overflow-hidden flex flex-col justify-between">
          <img src="https://raw.githubusercontent.com/ghareebnihad/Bzhar-barber/refs/heads/main/fon.jpg" alt="شەکرنا پرچێ" loading="eager" referrerpolicy="no-referrer" class="absolute inset-0 w-full h-full object-cover" onerror="this.style.display='none'" />
          <div class="absolute inset-0 bg-gradient-to-t from-obsidian via-obsidian/55 to-obsidian/15"></div>
          <div class="relative z-10 p-2.5 flex items-center justify-between">
            <span class="px-2 py-0.5 rounded-md bg-obsidian/80 border border-gold/45 text-gold text-[10px] font-bold">#6</span>
          </div>
          <div class="relative z-10 p-3 text-right bg-obsidian/55 border-t border-white/10">
            <div class="font-serif text-sm sm:text-base font-bold text-ivory truncate">شەکرنا پرچێ</div>
            <div class="text-sm sm:text-lg font-extrabold gold-gradient-text mt-0.5" dir="ltr">2,000</div>
          </div>
        </article>

        <article class="service-tile glass-card border border-white/15 relative overflow-hidden flex flex-col justify-between">
          <img src="https://raw.githubusercontent.com/ghareebnihad/Bzhar-barber/refs/heads/main/edit.png" alt="قەلەم کرن" loading="eager" referrerpolicy="no-referrer" class="absolute inset-0 w-full h-full object-cover" onerror="this.style.display='none'" />
          <div class="absolute inset-0 bg-gradient-to-t from-obsidian via-obsidian/55 to-obsidian/15"></div>
          <div class="relative z-10 p-2.5 flex items-center justify-between">
            <span class="px-2 py-0.5 rounded-md bg-obsidian/80 border border-gold/45 text-gold text-[10px] font-bold">#7</span>
          </div>
          <div class="relative z-10 p-3 text-right bg-obsidian/55 border-t border-white/10">
            <div class="font-serif text-sm sm:text-base font-bold text-ivory truncate">قەلەم کرن</div>
            <div class="text-sm sm:text-lg font-extrabold gold-gradient-text mt-0.5" dir="ltr">2,000</div>
          </div>
        </article>

        <article class="service-tile glass-card border border-white/15 relative overflow-hidden flex flex-col justify-between">
          <img src="https://raw.githubusercontent.com/ghareebnihad/Bzhar-barber/refs/heads/main/mask.png" alt="دانانا ماسکی" loading="eager" referrerpolicy="no-referrer" class="absolute inset-0 w-full h-full object-cover" onerror="this.style.display='none'" />
          <div class="absolute inset-0 bg-gradient-to-t from-obsidian via-obsidian/55 to-obsidian/15"></div>
          <div class="relative z-10 p-2.5 flex items-center justify-between">
            <span class="px-2 py-0.5 rounded-md bg-obsidian/80 border border-gold/45 text-gold text-[10px] font-bold">#8</span>
          </div>
          <div class="relative z-10 p-3 text-right bg-obsidian/55 border-t border-white/10">
            <div class="font-serif text-sm sm:text-base font-bold text-ivory truncate">دانانا ماسکی</div>
            <div class="text-sm sm:text-lg font-extrabold gold-gradient-text mt-0.5" dir="ltr">1,000</div>
          </div>
        </article>
      </div>
    </div>
  </section>

  <script>
    const actionLoader = document.getElementById('actionLoader');
    const homeHero = document.getElementById('homeHero');
    const reservationSection = document.getElementById('reservationSection');
    const servicesSection = document.getElementById('servicesSection');

    function runWithBarberLoader(onDone) {
      actionLoader.classList.remove('hidden');
      setTimeout(() => {
        actionLoader.classList.add('hidden');
        onDone();
      }, 750);
    }

    function showSection(target) {
      homeHero.classList.add('hidden');
      reservationSection.classList.add('hidden');
      servicesSection.classList.add('hidden');
      target.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('btnReservation').addEventListener('click', () => {
      runWithBarberLoader(() => showSection(reservationSection));
    });

    document.getElementById('btnServices').addEventListener('click', () => {
      runWithBarberLoader(() => showSection(servicesSection));
    });

    document.getElementById('backFromReservation').addEventListener('click', () => {
      showSection(homeHero);
    });

    document.getElementById('backFromServices').addEventListener('click', () => {
      showSection(homeHero);
    });

    document.getElementById('simpleBookingForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      if (!name || !phone) return;

      runWithBarberLoader(() => {
        document.getElementById('resultText').textContent = `${name} — ${phone}`;
        document.getElementById('bookingResult').classList.remove('hidden');
      });
    });
  </script>
</body>
</html>
